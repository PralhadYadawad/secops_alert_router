spec_version: 1
name: secops_env
description: "Cybersecurity SOC Alert Triage V2 — AI agent investigates realistic MITRE ATT&CK-mapped alerts using SIEM logs, threat intel, and asset context to contain threats or dismiss false positives"
type: space
runtime: fastapi
app: secops_env.server.app:app
port: 8000

tasks:
  - name: spam-filter
    description: "Easy: Identify and dismiss obvious spam/false-positive alerts with clear indicators"
    difficulty: easy
  - name: phishing-triage
    description: "Easy-Medium: Investigate phishing alerts with varying ambiguity levels"
    difficulty: easy-medium
  - name: insider-threat
    description: "Medium: Distinguish legitimate employee behavior from insider threats"
    difficulty: medium
  - name: lateral-movement
    description: "Medium-Hard: Detect attackers moving through the network across multiple hosts"
    difficulty: medium-hard
  - name: apt-campaign
    description: "Hard: Investigate multi-stage attacks requiring correlation across alerts and systems"
    difficulty: hard
  - name: adversarial-evasion
    description: "Expert: Detect adversaries using LOLBins, fileless malware, and encoded payloads"
    difficulty: expert
  - name: compliance-triage
    description: "Hard: Triage alerts on regulated data (GDPR/HIPAA/PCI-DSS) — breaching compliance-tagged incidents carries amplified penalties"
    difficulty: hard
  - name: cloud-native
    description: "Hard: Investigate AWS/Azure/K8s alerts — distinguish authorized DevOps ops from IAM escalation, CloudTrail tampering, SSRF, and container escapes"
    difficulty: hard
  - name: hipaa-triage
    description: "Hard: Triage healthcare security alerts (EHR anomalies, ransomware, IoMT) — HIPAA false negatives carry 2.5x compliance penalty"
    difficulty: hard
  - name: credential-access
    description: "Expert: Detect Kerberoasting, AS-REP roasting, DCSync, and Pass-the-Hash — SOX/PCI-DSS compliance multipliers on high-value attacks"
    difficulty: expert
  - name: queue-triage
    description: "Medium-Hard: Triage a 5-alert backlog and prioritize critical threats across concurrent incidents"
    difficulty: medium-hard
